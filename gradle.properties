# Every field here must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
mod_id=survivalfly
mod_version=1.3.9
mod_name=Survival Fly
description=A Fabric/(Neo)Forge mod that lets server owners allow players to fly in survival mode.
mod_author=Dillon8775
credits=Dillon8775
license=All rights reserved unless explicitly stated.
logo=assets/survivalfly/icon
mc_version=mc26.4
supported_mc_versions=26.4
# Use "-alpha.# for snapshots, "-pre.#" for pre-releases, "-rc.#" for release candidates
minecraft_version_range=>=26.4-pre.1 <26.5
group=net.dillon.survivalfly

# Links
homepage=https://modrinth.com/mod/survival-fly
sources=https://github.com/Dillon8775/Survival-Fly
issues=https://github.com/Dillon8775/Survival-Fly/issues
discord=https://discord.gg/vfqEAn4YFy

# Common
